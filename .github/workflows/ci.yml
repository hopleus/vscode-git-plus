name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix tools

      - name: Cache VS Code
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-${{ hashFiles('tools/config.json') }}

      - name: Download VS Code API types
        run: npm run types --prefix tools

      - name: Typecheck
        run: npm run typecheck --prefix tools

      - name: Test
        run: xvfb-run -a npm test --prefix tools
